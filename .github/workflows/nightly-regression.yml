# Nightly —— 每日全量回归（106 条 Playwright 用例）
#
# 环境：postgres:17 + redis:7 service 容器（账号/库名与 application.yml 一致），
# 每次运行都是全新容器 → 回归用例写库后天然隔离，无需清库脚本。
# 链路：构建 admin-boot jar → 后台拉起（9301）→ 健康等待 → vite dev（9302）
#       → playwright 回归矩阵 → 无论成败上传 artifacts。
#
# UTC 18:35 = 北京时间次日 02:35，避开整点高峰。
# 本地等价跑法见 README-CI.md。

name: Nightly Regression

on:
  schedule:
    - cron: '35 18 * * *' # UTC 18:35 ≈ 北京时间 02:35
  workflow_dispatch: {}

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  regression:
    name: full regression matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gateway4j
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test@2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gateway4j"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway4j-admin-ui/package-lock.json

      - name: Build admin-boot (Flyway 迁移随 jar)
        run: mvn -q clean package -pl gateway4j-admin-boot -am -DskipTests

      - name: Start admin-boot (9301)
        run: |
          nohup java -jar gateway4j-admin-boot/target/gateway4j-admin-boot.jar \
            > admin-boot.log 2>&1 &
          echo "admin-boot pid=$!"

      # 健康判定：/v1/dict/ROUTE_TYPE 匿名访问 401/500 也算活着 ——
      # 只要有 HTTP 状态码（非 000 连接失败）即说明 Spring 已完成启动并
      # 通过 Flyway 建库。上限 240s。
      - name: Wait for admin-boot healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9301/v1/dict/ROUTE_TYPE || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "admin-boot is up (HTTP $code)"
              exit 0
            fi
            echo "waiting admin-boot ... attempt $i"
            sleep 4
          done
          echo "::error::admin-boot did not become healthy in 240s"
          tail -200 admin-boot.log
          exit 1

      - name: Install frontend dependencies
        working-directory: gateway4j-admin-ui
        run: npm ci

      - name: Start vite dev (9302)
        working-directory: gateway4j-admin-ui
        run: |
          nohup npm run dev > ../vite-dev.log 2>&1 &
          echo "vite dev pid=$!"

      - name: Wait for vite dev (9302)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9302 || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "vite dev is up (HTTP $code)"
              exit 0
            fi
            echo "waiting vite dev ... attempt $i"
            sleep 2
          done
          echo "::error::vite dev did not start in 120s"
          tail -200 vite-dev.log
          exit 1

      # 本地 node_modules 锁的是 @playwright/test 1.60.0（build 1223）；
      # CI 走 npm ci + 按需安装浏览器，无本地 TLS 拦截问题。
      - name: Install Playwright chromium
        working-directory: gateway4j-admin-ui
        run: npx playwright install --with-deps chromium

      - name: Run regression matrix (106 cases)
        working-directory: gateway4j-admin-ui
        run: npx playwright test --config=playwright.regression.config.ts --reporter=list

      # 截图由 e2e-regression helper 写入 <repo>/test-report/<date>-<seq>/screenshots/
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: test-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload playwright test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: gateway4j-admin-ui/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            admin-boot.log
            vite-dev.log
          retention-days: 14
          if-no-files-found: warn
