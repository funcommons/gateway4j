# CI —— PR / main 推送门槛
#
# 三个独立 job，全部必须绿（无 continue-on-error 容忍）：
#   frontend  前端 ESLint + type-check + Vitest 全量单测（1681 例）
#   backend   后端 gateway4j-admin 及其依赖模块单元测试（96 例）
#   guards    权限码差集 + 接口契约护栏（纯 Node 脚本，零依赖）
#
# TODO(P1-8/H2)：scripts/check-write-guardrails.mjs 落地后加入 guards job
# （写操作护栏脚本校验，具体步骤等该脚本合入后由主 agent 决定接线方式）。

name: CI

on:
  pull_request:
    paths:
      - 'gateway4j-admin-ui/**'
      - 'gateway4j-admin/**'
      - 'gateway4j-admin-boot/**'
      - 'gateway4j-common/**'
      - 'gateway4j-engine/**'
      - 'gateway4j-plugin-api/**'
      - 'gateway4j-plugin-builtins/**'
      - 'gateway4j-gateway-boot/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'gateway4j-admin-ui/**'
      - 'gateway4j-admin/**'
      - 'gateway4j-admin-boot/**'
      - 'gateway4j-common/**'
      - 'gateway4j-engine/**'
      - 'gateway4j-plugin-api/**'
      - 'gateway4j-plugin-builtins/**'
      - 'gateway4j-gateway-boot/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (eslint + type-check + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway4j-admin-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway4j-admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 单测（Vitest/jsdom）本身不需要浏览器；这里按回归矩阵基线安装 chromium，
      # 保证该 runner 随时可复用于 e2e 冒烟。CI 网络无本地 TLS 拦截问题。
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # 零 error 基线（P2-8）：规则只拦真问题，warning 记账不拦截
      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npx vitest run

  backend:
    name: backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Unit tests (gateway4j-admin + deps)
        run: mvn -q -pl gateway4j-admin -am test

  guards:
    name: guards (permissions + api contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 两个脚本为纯 Node ESM、零三方依赖，无需 npm ci
      - name: Permission codes guard
        run: node scripts/check-permissions.mjs

      - name: API contract guard
        run: node scripts/check-api-contract.mjs
