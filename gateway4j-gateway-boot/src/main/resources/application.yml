server:
  port: 9300

spring:
  application:
    name: gateway4j-gateway

  autoconfigure:
    # OpenIdAutoConfiguration 无 ConditionalOnWebApplication 守卫，其 WebMvcConfigurer
    # 签名在纯 reactive 网关（无 spring-webmvc）下 introspect 即 CNFE；网关数据面
    # 不使用 openid（MVC 参数解析/Jackson 定制均为 Servlet 侧能力），故显式排除。
    exclude: com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthContributorAutoConfiguration,fun.commons.framework4j.openid.config.OpenIdAutoConfiguration

  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes: []

logging:
  level:
    fun.commons: info
    fun.commons.framework4j: info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

framework4j:
  datasource:
    enabled: true
    datasources:
      default:
        url: jdbc:postgresql://localhost:5432/gateway4j
        username: admin
        password: test@2026
        driver-class-name: org.postgresql.Driver
        druid:
          initial-size: 2
          max-active: 10

  redis:
    enabled: true
    datasources:
      default:
        host: localhost
        port: 6379
        database: 0

  signature:
    enabled: true
    path-patterns: /v1/open/**
    redis-name: default

gateway4j:
  config:
    # Fallback poll only — primary propagation is the Redis push channel gateway4j:config:changed
    poll-interval-ms: 60000
  open-api:
    app-key: gateway4j-open
    app-secret: dev-test-secret-key
