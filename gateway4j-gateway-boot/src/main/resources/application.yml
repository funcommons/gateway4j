server:
  port: 9300

spring:
  application:
    name: gateway4j-gateway

  autoconfigure:
    # OpenIdAutoConfiguration 无 ConditionalOnWebApplication 守卫，其 WebMvcConfigurer
    # 签名在纯 reactive 网关（无 spring-webmvc）下 introspect 即 CNFE；网关数据面
    # 不使用 openid（MVC 参数解析/Jackson 定制均为 Servlet 侧能力），故显式排除。
    exclude: com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.jdbc.DataSourceHealthContributorAutoConfiguration,fun.commons.framework4j.openid.config.OpenIdAutoConfiguration

  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes: []

logging:
  level:
    fun.commons: info
    fun.commons.framework4j: info

management:
  endpoints:
    web:
      exposure:
        # 9300 数据面暴露面收敛：只放健康/信息/指标，其余 actuator 端点一律不暴露
        include: health,info,prometheus
  health:
    # LoggingElasticsearchPlugin 把 ES 客户端带上了 classpath，actuate 据此自动注册
    # ElasticsearchHealthIndicator；ES 中间件未部署（可选插件）时 /actuator/health
    # 恒为 503 DOWN，淹没真实健康状态。这里显式关闭该贡献者（数据面日志走插件的
    # fail-open 通道，不依赖此健康检查），health 恢复 UP；show-details 保持默认
    # never，避免内部细节外泄。
    elasticsearch:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

framework4j:
  datasource:
    enabled: true
    datasources:
      default:
        url: jdbc:postgresql://localhost:5432/gateway4j
        username: admin
        password: test@2026
        driver-class-name: org.postgresql.Driver
        druid:
          initial-size: 2
          max-active: 10
          # v1.10.0 起框架缺省不再带 wall，此处显式保持升级前行为（stat,wall,slf4j）；
          # 本服务运行时无 Flyway，wall 无碍。
          filters: stat,wall,slf4j

  redis:
    enabled: true
    datasources:
      default:
        host: localhost
        port: 6379
        database: 0

  signature:
    enabled: true
    path-patterns: /v1/open/**
    redis-name: default

gateway4j:
  # P2-2 多环境：本数据面实例装载的环境标识（引擎按 environment 过滤 gw_route）。
  # 单环境部署保持 default，与多环境前行为完全一致；多环境部署时每个实例覆盖此值。
  env: default
  config:
    # Fallback poll only — primary propagation is the Redis push channel gateway4j:config:changed
    poll-interval-ms: 60000
  engine:
    plugin-loader:
      # 动态插件（GROOVY/JAR，ADR-003 第一阶段）单次执行墙钟上限；超时按该插件 on_error 语义处理
      exec-timeout-ms: 1000
      # JAR 插件沙箱父 ClassLoader 在默认白名单（plugin-api+common+web/reactor/slf4j）外
      # 额外放行的包前缀；扩白名单会削弱隔离，优先把依赖打进插件 jar。
      # jar-parent-packages: ["com.fasterxml.jackson."]
  open-api:
    app-key: gateway4j-open
    app-secret: dev-test-secret-key
  debug:
    # S11a 影子回放共享口令：admin 调试台以 X-Gw4j-Shadow 头携带此口令标记影子
    # 请求（引擎豁免其 in-flight gauge / 插件级统计 / 路由计数，插件链照跑留痕）。
    # 空值 = 影子识别关闭（任何头都不构成影子）。默认值仅供本地联调，生产必改。
    shadow-token: local-debug-shadow
