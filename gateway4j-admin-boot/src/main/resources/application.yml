server:
  port: 9301

spring:
  application:
    name: gateway4j-admin

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    fun.commons: info
    fun.commons.framework4j: info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

framework4j:
  datasource:
    enabled: true
    datasources:
      default:
        url: jdbc:postgresql://localhost:5432/gateway4j
        username: admin
        password: test@2026
        driver-class-name: org.postgresql.Driver
        druid:
          initial-size: 2
          max-active: 10
          # 框架默认 stat,wall,slf4j —— wall（SQL 防火墙）解析不了 Flyway 迁移中的
          # PL/pgSQL（CREATE OR REPLACE FUNCTION ... $$），全新库首启会拦掉 V1.0.0。
          # 管理库 SQL 全部为 MyBatis 服务端生成（无用户拼接），此处去掉 wall。
          filters: stat,slf4j

  redis:
    enabled: true
    datasources:
      default:
        host: localhost
        port: 6379
        database: 0

  access-token:
    enabled: true
    secret-key: gateway4j-dev-secret-key-0123456789abcdef0123456789
    hash-salt: gateway4j-dev-hash-salt
    expire-time: 7200
    redis-name: default
    policies:
      BEARER:
        key: user_id

  signature:
    enabled: true
    path-patterns: /v1/open/**
    redis-name: default

  # 登录接口自我保护限流（AuthController#login @RateLimit 10 次/分钟/IP）。
  # 拦截路径收窄到 /v1/auth/**，避免默认 100/min 波及其余管理面接口；
  # framework4j 默认白名单含 /v1/auth/login 与 127.0.0.1，会令限流失效，这里显式清空。
  rate-limit:
    enabled: true
    redis-name: default
    path-patterns:
      - /v1/auth/**
    whitelist-paths: []
    whitelist-ips: []

gateway4j:
  open-api:
    app-key: gateway4j-open
    app-secret: dev-test-secret-key
